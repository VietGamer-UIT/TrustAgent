
services:
  db:
    image: postgres:15-alpine
    container_name: trustagent-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trustagent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - trustagent-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: trustagent-backend
    ports:
      - "8000:8000"
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/trustagent_db
      # Đồng bộ key cho Forensics (đọc GEMINI_API_KEY hoặc GOOGLE_API_KEY)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-${GOOGLE_API_KEY:-}}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Backend:/app
      - ./Backend/uploads:/app/uploads
      - ./Backend/rag/chroma_db:/app/rag/chroma_db
      # Cho forensics.config đọc được file .env gốc
      - ./.env:/app/../.env:ro
    networks:
      - trustagent-network
    restart: unless-stopped

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - BACKEND_URL=http://backend:8000
        - NEXT_PUBLIC_API_URL=
    container_name: trustagent-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    networks:
      - trustagent-network
    restart: unless-stopped

volumes:
  pgdata:

networks:
  trustagent-network:
    driver: bridge
